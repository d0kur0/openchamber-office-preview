name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Build distributable and checksum
        shell: bash
        run: |
          npm pack --pack-destination .
          mkdir -p dist/office-preview
          cp package.json README.md LICENSE THIRD_PARTY_NOTICES.md dist/office-preview/
          cp -R panel licenses dist/office-preview/
          (cd dist && zip -qr "../openchamber-office-preview-${GITHUB_REF_NAME}.zip" office-preview)
          sha256sum openchamber-office-preview-*.tgz openchamber-office-preview-*.zip > SHA256SUMS.txt
      - name: Publish npm package with OIDC
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          npm view "openchamber-office-preview@$VERSION" version --json > published.json 2> registry-error.txt && ALREADY_PUBLISHED=true || ALREADY_PUBLISHED=false
          if [ "$ALREADY_PUBLISHED" = true ]; then
            echo "Version $VERSION already exists on npm; preserving the immutable package."
          else
            if ! grep -q 'E404' registry-error.txt; then cat registry-error.txt; exit 1; fi
            npm publish "openchamber-office-preview-$VERSION.tgz" --access public
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" openchamber-office-preview-*.zip openchamber-office-preview-*.tgz SHA256SUMS.txt --clobber
